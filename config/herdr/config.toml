onboarding = false

[theme]
name = "gruvbox"

auto_switch = false
[terminal]
default_shell = "/bin/zsh"
shell_mode = "auto"
new_cwd = "follow"

[keys]
# Keep tmux muscle memory while using Herdr's explicit prefix syntax.
prefix = "ctrl+a"
detach = "prefix+d"
reload_config = "prefix+r"
resize_mode = "prefix+shift+r"

# Workspaces and Git worktrees.
settings = ""
workspace_picker = "prefix+w"
goto = "prefix+g"
new_workspace = "prefix+shift+n"
rename_workspace = "prefix+shift+w"
close_workspace = "prefix+shift+d"
previous_workspace = "prefix+alt+p"
next_workspace = "prefix+alt+n"
switch_workspace = "prefix+shift+1..9"
new_worktree = "prefix+shift+g"
open_worktree = "prefix+alt+o"
remove_worktree = "prefix+alt+x"

previous_agent = "prefix+ctrl+p"
next_agent = "prefix+ctrl+n"

new_tab = "prefix+c"
previous_tab = "prefix+p"
next_tab = "prefix+n"
close_tab = ["prefix+q", "prefix+ampersand"]

focus_pane_left = ""
focus_pane_down = ""
focus_pane_up = ""
focus_pane_right = ""
swap_pane_up = "prefix+comma"
swap_pane_down = "prefix+."

split_vertical = "prefix+|"
split_horizontal = "prefix+minus"
close_pane = "prefix+x"
zoom = "prefix+z"

[ui]
sidebar_width = 34
sidebar_min_width = 34
sidebar_max_width = 34
sidebar_start_collapsed = false
mouse_capture = true
copy_on_select = true
confirm_close = false
show_agent_labels_on_pane_borders = true
accent = "cyan"
pane_gaps = false
prompt_new_tab_name = true
prompt_new_workspace_name = true
agent_panel_sort = "spaces"

[ui.sidebar.spaces]
row_gap = 1
rows = [["state_icon", "workspace"]]

[ui.toast]
delivery = "terminal"
delay_seconds = 0

[ui.toast.herdr]
position = "top-right"

[ui.toast.clipboard]
position = "bottom-center"

[ui.sound]
enabled = true

[session]
resume_agents_on_restore = true

[advanced]
# Scrollback limit is byte-based.
scrollback_limit_bytes = 52428800

[experimental]
pane_history = false
switch_ascii_input_source_in_prefix = true
kitty_graphics = true
allow_nested = false

[[keys.command]]
key = "prefix+l"
type = "shell"
command = "herdr pane send-keys \"$HERDR_ACTIVE_PANE_ID\" ctrl+l"
description = "clear screen"

[[keys.command]]
key = "prefix+e"
type = "plugin_action"
command = "com.elliotekj.herdr-easymotion.pane"
description = "select pane"

[[keys.command]]
key = "prefix+shift+s"
type = "plugin_action"
command = "herdr-navigator.open"
description = "jump to anything"

[[keys.command]]
key = "prefix+s"
type = "plugin_action"
command = "sessionizer.pick"
description = "fuzzy-switch workspace"

[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "sessionizer.agents"
description = "jump to an agent"

# [[keys.command]]
# key = "prefix+["
# type = "shell"
# command = "herdr plugin pane open --plugin copy-search --entrypoint copy"

[[keys.command]]
key = "prefix+/"
type = "shell"
command = "herdr plugin pane open --plugin copy-search --entrypoint search"

[[keys.command]]
key = "prefix+tab"
type = "shell"
command = "herdr plugin pane open --plugin copy-search --entrypoint extract"

[ui.sidebar.agents]
row_gap = 1
rows = [
  ["state_icon", "workspace", "state_text"],
  [{ token = "terminal_title_stripped", dim = false, fg = "#a89984" }]
]

[ui.sidebar.agents.rows_by_agent]
# `$title` is reported by pi-config/extensions/herdr-title (session name, scrolls when long).
pi = [
  ["state_icon", "workspace", "state_text"],
  [{ token = "$title", dim = false, fg = "#a89984" }]
]

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "smart-splits.nvim.left"
description = "navigate left (vim/herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "smart-splits.nvim.down"
description = "navigate down (vim/herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "smart-splits.nvim.up"
description = "navigate up (vim/herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "smart-splits.nvim.right"
description = "navigate right (vim/herdr)"

[[keys.command]]
key = "prefix+ctrl+s"
type = "plugin_action"
command = "ntindle.herdr-resurrect.save"
description = "resurrect: save"

[[keys.command]]
key = "prefix+ctrl+r"
type = "plugin_action"
command = "ntindle.herdr-resurrect.restore"
description = "resurrect: restore"

[[keys.command]]
key = "super+k"
type = "plugin_action"
command = "vjeantet.palette.open"
description = "Command palette"

[[keys.command]]
key = "super+e"
type = "plugin_action"
command = "chmarax.herdr-nvim.toggle"
description = "nvim sidebar"

[[keys.command]]
key = "prefix+space"
type = "plugin_action"
command = "chmarax.herdr-nvim.pick-file"
description = "open file from agent output"
